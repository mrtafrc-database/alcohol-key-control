<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alcohol Test & Key Control</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #17323b;
      background: #eef4f7;
    }
    header {
      background: #007b83;
      color: white;
      padding: 15px 22px;
    }
    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    header h1 {
      margin: 0;
      font-size: 21px;
    }
    main {
      max-width: 1200px;
      margin: 22px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      border: 1px solid #d8e2e5;
      border-radius: 13px;
      padding: 20px;
      box-shadow: 0 3px 12px #17323b12;
    }
    .login-card {
      max-width: 420px;
      margin: 70px auto;
    }
    h2 { margin-top: 0; }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font: inherit;
      border-radius: 7px;
    }
    input, select, textarea {
      border: 1px solid #b8c8ce;
      background: white;
    }
    textarea {
      min-height: 70px;
      resize: vertical;
    }
    button {
      border: 0;
      background: #007b83;
      color: white;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { background: #005f66; }
    button.secondary { background: #68757a; }
    button.warning { background: #b77900; }
    button.danger { background: #b42318; }
    button.small {
      width: auto;
      margin: 0;
      padding: 8px 12px;
    }
    .hidden { display: none !important; }
    .message {
      min-height: 20px;
      margin-top: 12px;
      white-space: pre-wrap;
    }
    .error { color: #b42318; }
    .success { color: #18794e; }
    .layout {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
      align-items: start;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .tabs {
      max-width: 1200px;
      margin: 18px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 8px;
    }
    .tabs button {
      width: auto;
      margin: 0;
      background: #dce9ec;
      color: #17323b;
    }
    .tabs button.active {
      background: #007b83;
      color: white;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: end;
      margin-bottom: 15px;
    }
    .toolbar > div {
      flex: 1;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
    }
    th, td {
      padding: 9px;
      border-bottom: 1px solid #d8e2e5;
      text-align: left;
      font-size: 14px;
      vertical-align: top;
    }
    th {
      background: #eaf3f5;
      white-space: nowrap;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .passed { background: #dcf5e5; color: #176b35; }
    .awaiting { background: #fff0c2; color: #8a5a00; }
    .failed { background: #ffe1df; color: #a61b16; }
    .borrowed { background: #fff0c2; color: #8a5a00; }
    .returned { background: #dcf5e5; color: #176b35; }
    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .header-inner { align-items: flex-start; flex-direction: column; }
      .toolbar { display: block; }
      .toolbar button { margin-top: 8px; }
    }
  </style>
</head>
<body>
<section id="login-page">
  <div class="card login-card">
    <h2>Alcohol Test & Key Control</h2>
    <form id="login-form">
      <label>Username</label>
      <input id="login-username" required>
      <label>Password</label>
      <input id="login-password" type="password" required>
      <button>Login</button>
    </form>
    <div id="login-message" class="message"></div>
  </div>
</section>
<section id="app-page" class="hidden">
  <header>
    <div class="header-inner">
      <div>
        <h1>Alcohol Test & Key Control</h1>
        <small>ระบบตรวจแอลกอฮอล์และจัดการกุญแจ</small>
      </div>
      <div>
        <span id="user-label"></span>
        <button id="logout" class="secondary small">Logout</button>
      </div>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="inspection-tab">
      ตรวจแอลกอฮอล์
    </button>
    <button class="tab" data-tab="vehicle-tab">
      รถ
    </button>
    <button class="tab" data-tab="key-tab">
      กุญแจ
    </button>
  </nav>
  <main>
    <!-- Inspection -->
    <section id="inspection-tab" class="tab-page">
      <div class="layout">
        <div class="card">
          <h2>บันทึกการตรวจ</h2>
          <form id="inspection-form">
            <label>Employee GID</label>
            <input id="employee-gid" required>
            <label>ชื่อพนักงาน</label>
            <input id="employee-name" required>
            <label>แผนก</label>
            <input id="department" required>
            <div class="form-row">
              <div>
                <label>ค่าแอลกอฮอล์ mg/L</label>
                <input id="result-mg-l" type="number"
                       min="0" step="0.001" value="0" required>
              </div>
              <div>
                <label>ผลตัดสิน</label>
                <select id="decision">
                  <option value="Passed">Passed</option>
                  <option value="NotPassed">NotPassed</option>
                </select>
              </div>
            </div>
            <label>หมายเหตุ</label>
            <textarea id="inspection-notes"></textarea>
            <button>บันทึกการตรวจครั้งที่ 1</button>
          </form>
          <div id="inspection-message" class="message"></div>
        </div>
        <div class="card">
          <div class="toolbar">
            <div>
              <label>ค้นหา</label>
              <input id="inspection-search"
                     placeholder="GID / ชื่อ / แผนก">
            </div>
            <button id="inspection-refresh"
                    class="secondary small">
              Refresh
            </button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>เวลา</th>
                  <th>GID</th>
                  <th>ชื่อ</th>
                  <th>แผนก</th>
                  <th>ครั้ง</th>
                  <th>mg/L</th>
                  <th>ผล</th>
                  <th>สถานะ</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="inspection-list"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
    <!-- Vehicles -->
    <section id="vehicle-tab" class="tab-page hidden">
      <div class="layout">
        <div class="card">
          <h2>เพิ่มรถ</h2>
          <form id="vehicle-form">
            <label>ทะเบียนรถ</label>
            <input id="vehicle-plate" required>
            <label>ชื่อรถ / รายละเอียด</label>
            <input id="vehicle-name">
            <button>เพิ่มรถ</button>
          </form>
          <div id="vehicle-message" class="message"></div>
        </div>
        <div class="card">
          <h2>รายการรถ</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ทะเบียน</th>
                  <th>ชื่อรถ</th>
                  <th>สถานะ</th>
                </tr>
              </thead>
              <tbody id="vehicle-list"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
    <!-- Keys -->
    <section id="key-tab" class="tab-page hidden">
      <div class="layout">
        <div class="card">
          <h2>ส่งมอบกุญแจ</h2>
          <form id="handover-form">
            <label>Inspection ID</label>
            <input id="handover-inspection-id" required>
            <label>เลือกรถ</label>
            <select id="handover-vehicle" required></select>
            <label>หมายเหตุ</label>
            <textarea id="handover-notes"></textarea>
            <button>ส่งมอบกุญแจ</button>
          </form>
          <div id="handover-message" class="message"></div>
        </div>
        <div class="card">
          <h2>รายการกุญแจ</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ทะเบียน</th>
                  <th>Inspection ID</th>
                  <th>ส่งมอบเมื่อ</th>
                  <th>สถานะ</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="handover-list"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
</section>
<script>
const API = "https://alcohol-key-control-api.mrtafrc.workers.dev";
let currentUser = null;
let vehicles = [];
const $ = id => document.getElementById(id);
function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
function dateText(value) {
  if (!value) return "-";
  const date = new Date(value);
  return Number.isNaN(date.getTime())
    ? esc(value)
    : date.toLocaleString("th-TH");
}
function badge(value) {
  const text = String(value || "");
  let cls = "";
  if (text === "Passed" || text === "Returned") cls = "passed";
  else if (text === "Borrowed") cls = "borrowed";
  else if (text.includes("Awaiting")) cls = "awaiting";
  else if (text === "Failed" || text === "NotPassed") cls = "failed";
  return `<span class="badge ${cls}">${esc(text)}</span>`;
}
async function api(path, options = {}) {
  const response = await fetch(API + path, {
    headers: {
      "Content-Type": "application/json"
    },
    ...options
  });
  const result = await response.json();
  if (!response.ok || !result.ok) {
    throw new Error(result.error || "ระบบทำรายการไม่สำเร็จ");
  }
  return result;
}
function showApp(user) {
  currentUser = user;
  $("login-page").classList.add("hidden");
  $("app-page").classList.remove("hidden");
  $("user-label").textContent =
    `${user.displayName} (${user.username}) - ${user.role}`;
  loadInspections();
  loadVehicles();
  loadHandovers();
}
$("login-form").addEventListener("submit", async event => {
  event.preventDefault();
  try {
    const result = await api("/api/login", {
      method: "POST",
      body: JSON.stringify({
        username: $("login-username").value.trim(),
        password: $("login-password").value
      })
    });
    showApp(result.user);
  } catch (error) {
    $("login-message").className = "message error";
    $("login-message").textContent = error.message;
  }
});
$("logout").addEventListener("click", () => {
  currentUser = null;
  $("app-page").classList.add("hidden");
  $("login-page").classList.remove("hidden");
  $("login-form").reset();
});
document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x =>
      x.classList.remove("active")
    );
    document.querySelectorAll(".tab-page").forEach(x =>
      x.classList.add("hidden")
    );
    button.classList.add("active");
    $(button.dataset.tab).classList.remove("hidden");
    if (button.dataset.tab === "vehicle-tab") loadVehicles();
    if (button.dataset.tab === "key-tab") loadHandovers();
  });
});
$("inspection-form").addEventListener("submit", async event => {
  event.preventDefault();
  try {
    const result = await api("/api/inspections", {
      method: "POST",
      body: JSON.stringify({
        employee_gid: $("employee-gid").value.trim(),
        employee_name: $("employee-name").value.trim(),
        department: $("department").value.trim(),
        result_mg_l: Number($("result-mg-l").value),
        decision: $("decision").value,
        notes: $("inspection-notes").value,
        recorded_by: currentUser.userId
      })
    });
    $("inspection-message").className = "message success";
    $("inspection-message").textContent =
      `บันทึกสำเร็จ Inspection ID: ${result.inspection_id}`;
    $("inspection-form").reset();
    $("result-mg-l").value = "0";
    $("decision").value = "Passed";
    loadInspections();
  } catch (error) {
    $("inspection-message").className = "message error";
    $("inspection-message").textContent = error.message;
  }
});
async function loadInspections() {
  const search = encodeURIComponent(
    $("inspection-search")?.value.trim() || ""
  );
  try {
    const result = await api(`/api/inspections?search=${search}`);
    $("inspection-list").innerHTML =
      (result.inspections || []).map(item => `
        <tr>
          <td>${dateText(item.last_tested_at)}</td>
          <td>${esc(item.employee_gid)}</td>
          <td>${esc(item.employee_name)}</td>
          <td>${esc(item.department)}</td>
          <td>${esc(item.attempt_no || item.attempt_count)}</td>
          <td>${esc(item.result_mg_l)}</td>
          <td>${badge(item.decision)}</td>
          <td>${badge(item.test_status)}</td>
          <td>
            <button class="small"
              onclick="addAttempt('${esc(item.inspection_id)}')">
              เพิ่ม Attempt
            </button>
          </td>
        </tr>
      `).join("") ||
      `<tr><td colspan="9">ยังไม่มีข้อมูล</td></tr>`;
  } catch (error) {
    $("inspection-list").innerHTML =
      `<tr><td colspan="9">${esc(error.message)}</td></tr>`;
  }
}
$("inspection-search").addEventListener("input", loadInspections);
$("inspection-refresh").addEventListener("click", loadInspections);
async function addAttempt(inspectionId) {
  const value = prompt("ค่าแอลกอฮอล์ mg/L");
  if (value === null) return;
  const resultMgL = Number(value);
  if (!Number.isFinite(resultMgL) || resultMgL < 0) {
    alert("กรุณาระบุค่าแอลกอฮอล์ให้ถูกต้อง");
    return;
  }
  const decision = resultMgL === 0 ? "Passed" : "NotPassed";
  const notes = prompt("หมายเหตุ", "") ?? "";
  try {
    await api(`/api/inspections/${inspectionId}`, {
      method: "POST",
      body: JSON.stringify({
        result_mg_l: resultMgL,
        decision,
        notes,
        recorded_by: currentUser.userId
      })
    });
    alert("บันทึก Attempt สำเร็จ");
    loadInspections();
  } catch (error) {
    alert(error.message);
  }
}
async function loadVehicles() {
  try {
    const result = await api("/api/vehicles");
    vehicles = result.vehicles || [];
    $("vehicle-list").innerHTML =
      vehicles.map(vehicle => `
        <tr>
          <td>${esc(vehicle.plate)}</td>
          <td>${esc(vehicle.vehicle_name)}</td>
          <td>${vehicle.active ? badge("Active") : badge("Inactive")}</td>
        </tr>
      `).join("") ||
      `<tr><td colspan="3">ยังไม่มีข้อมูลรถ</td></tr>`;
    $("handover-vehicle").innerHTML =
      `<option value="">เลือก รถ</option>` +
      vehicles
        .filter(vehicle => Number(vehicle.active) === 1)
        .map(vehicle =>
          `<option value="${esc(vehicle.vehicle_id)}">
            ${esc(vehicle.plate)} ${esc(vehicle.vehicle_name)}
          </option>`
        )
        .join("");
  } catch (error) {
    $("vehicle-list").innerHTML =
      `<tr><td colspan="3">${esc(error.message)}</td></tr>`;
  }
}
$("vehicle-form").addEventListener("submit", async event => {
  event.preventDefault();
  try {
    await api("/api/vehicles", {
      method: "POST",
      body: JSON.stringify({
        plate: $("vehicle-plate").value.trim(),
        vehicle_name: $("vehicle-name").value.trim(),
        created_by: currentUser.userId
      })
    });
    $("vehicle-message").className = "message success";
    $("vehicle-message").textContent = "เพิ่มรถสำเร็จ";
    $("vehicle-form").reset();
    loadVehicles();
  } catch (error) {
    $("vehicle-message").className = "message error";
    $("vehicle-message").textContent = error.message;
  }
});
async function loadHandovers() {
  try {
    const result = await api("/api/handovers");
    $("handover-list").innerHTML =
      (result.handovers || []).map(item => `
        <tr>
          <td>${esc(item.plate_snapshot)}</td>
          <td>${esc(item.inspection_id)}</td>
          <td>${dateText(item.handed_over_at)}</td>
          <td>${badge(item.status)}</td>
          <td>
            ${
              item.status === "Borrowed"
                ? `<button class="small warning"
                    onclick="returnKey('${esc(item.handover_id)}')">
                    รับคืน
                   </button>`
                : ""
            }
          </td>
        </tr>
      `).join("") ||
      `<tr><td colspan="5">ยังไม่มีรายการกุญแจ</td></tr>`;
  } catch (error) {
    $("handover-list").innerHTML =
      `<tr><td colspan="5">${esc(error.message)}</td></tr>`;
  }
}
$("handover-form").addEventListener("submit", async event => {
  event.preventDefault();
  try {
    await api("/api/handovers", {
      method: "POST",
      body: JSON.stringify({
        inspection_id: $("handover-inspection-id").value.trim(),
        vehicle_id: $("handover-vehicle").value,
        handed_over_by: currentUser.userId,
        notes: $("handover-notes").value
      })
    });
    $("handover-message").className = "message success";
    $("handover-message").textContent = "ส่งมอบกุญแจสำเร็จ";
    $("handover-form").reset();
    loadHandovers();
  } catch (error) {
    $("handover-message").className = "message error";
    $("handover-message").textContent = error.message;
  }
});
async function returnKey(handoverId) {
  const gid = prompt("GID ผู้คืนกุญแจ");
  if (!gid) return;
  const name = prompt("ชื่อผู้คืนกุญแจ");
  if (!name) return;
  const department = prompt("แผนก", "") ?? "";
  const notes = prompt("หมายเหตุ", "") ?? "";
  try {
    await api("/api/returns", {
      method: "POST",
      body: JSON.stringify({
        handover_id: handoverId,
        returned_by_gid: gid,
        returned_by_name: name,
        returned_by_department: department,
        received_by: currentUser.userId,
        notes
      })
    });
    alert("บันทึกการคืนกุญแจสำเร็จ");
    loadHandovers();
  } catch (error) {
    alert(error.message);
  }
}
</script>
</body>
</html>
