<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alcohol Test &amp; Key Control</title>
  <style>
    :root{
      --navy:#12383f;
      --teal:#006d77;
      --aqua:#dff2f2;
      --bg:#f3f7f8;
      --ink:#183b45;
      --muted:#647d85;
      --line:#dbe6e9;
      --yellow:#fff3cd;
      --green:#e2f3e8;
      --blue:#e5effb;
      --red:#a13232;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font:15px/1.55 Arial,Tahoma,sans-serif;
      background:var(--bg);
      color:var(--ink);
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    button:focus-visible,input:focus,select:focus,textarea:focus{
      outline:3px solid #6bcbd0;
      outline-offset:2px;
    }
    input,select,textarea{
      width:100%;
      padding:11px 12px;
      border:1px solid #c9d9de;
      border-radius:9px;
      color:var(--ink);
      background:white;
    }
    textarea{min-height:82px;resize:vertical}
    label{display:block;font-weight:600;margin-bottom:5px}
    small,.muted{color:var(--muted)}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:26px;margin-bottom:5px}
    h2{font-size:21px}
    h3{font-size:17px}
    a{color:var(--teal)}
    .hidden{display:none!important}
    .btn{
      border:0;
      border-radius:9px;
      padding:11px 20px;
      background:var(--teal);
      color:white;
      font-weight:bold;
    }
    .btn.secondary{background:#e4edf0;color:var(--navy)}
    .btn.danger{background:var(--red)}
    .btn.warning{background:#956319;color:white}
    .btn.tiny{padding:6px 10px;font-size:13px}
    .login{max-width:450px;margin:7vh auto;padding:30px}
    .card{
      background:white;
      border:1px solid var(--line);
      border-radius:15px;
      padding:24px;
      box-shadow:0 4px 16px #12383f05;
      margin-bottom:20px;
    }
    .brand{
      font-size:12px;
      letter-spacing:2px;
      font-weight:bold;
      color:var(--teal);
      margin-bottom:15px;
    }
    .field{margin-bottom:16px}
    .shell{min-height:100vh}
    .main{width:100%;padding:12px 24px}
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:14px;
    }
    .topbar h1{font-size:18px;line-height:1.05;margin:0 0 3px}
    #pageSubtitle{font-size:11px;line-height:1.3}
    .top-actions{
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
    }
    .topbar .btn.tiny{padding:4px 9px}
    .account{font-size:12px;line-height:1.2;text-align:right}
    .row{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:18px;
    }
    .row.employee-row{
      grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);
    }
    .row>.field{min-width:0}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .toolbar>*{flex:1;min-width:130px}
    .toolbar .fixed{flex:0 0 auto}
    .table-wrap{
      overflow:auto;
      border:1px solid var(--line);
      border-radius:10px;
      max-height:560px;
    }
    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      white-space:nowrap;
      font-size:14px;
    }
    th{
      text-align:left;
      background:#e9f1f3;
      color:#36555d;
      position:sticky;
      top:0;
      z-index:1;
      white-space:normal;
      min-width:105px;
    }
    th,td{padding:13px 10px;border-bottom:1px solid #edf2f4}
    td{vertical-align:top}
    tr:last-child td{border-bottom:0}
    #content>.card{padding:12px;margin-bottom:10px}
    #content>.card>.toolbar input,
    #content>.card>.toolbar select{padding:5px 10px}
    #content>.card>.toolbar .btn{padding:6px 14px}
    #content>.card>.callout{
      padding:6px 10px;
      margin:8px 0!important;
      font-size:12px;
      line-height:1.3;
    }
    #content .table-wrap{max-height:calc(100vh - 190px)}
    #content th,#content td{padding:4px 8px;line-height:1.15}
    #content td{vertical-align:middle;font-size:13px}
    #content td small{font-size:11px;line-height:1.1}
    #content td .btn.tiny{padding:2px 6px;font-size:12px}
    #content td .badge{padding:2px 7px;line-height:1.15}
    .actions{display:flex;gap:4px;flex-wrap:wrap;min-width:140px}
    .notes-cell{
      max-width:260px;
      min-width:140px;
      white-space:normal;
      overflow-wrap:anywhere;
    }
    .attempt-result{
      display:inline-block;
      border-radius:5px;
      padding:3px 5px;
      line-height:1.15;
    }
    .attempt-result strong{font-size:13px}
    .attempt-result small{display:block;margin-top:2px}
    .attempt-fail{
      background:#fde8e6;
      color:#922d27;
      border-left:3px solid #c24b42;
    }
    .attempt-fail small{color:#823a34}
    .attempt-pass{
      background:#e8f3eb;
      color:#235f3b;
      border-left:3px solid #43865b;
    }
    .attempt-pass small{color:#3e654b}
    .badge{
      display:inline-block;
      font-size:12px;
      padding:2px 7px;
      border-radius:7px;
      border:1px solid var(--ak-border,#c8d2da);
      background:var(--ak-bg,#edf1f4);
      color:var(--ak-ink,#455663);
      font-weight:600;
      white-space:nowrap;
    }
    [data-status="all"]{
      --ak-bg:#edf1f4;--ak-ink:#455663;--ak-border:#c8d2da;
    }
    [data-status="waiting"]{
      --ak-bg:#fff3d6;--ak-ink:#76530d;--ak-border:#e6c977;
    }
    [data-status="passed"]{
      --ak-bg:#e6f3eb;--ak-ink:#225e3b;--ak-border:#9bc8ac;
    }
    [data-status="failed"]{
      --ak-bg:#fde9e7;--ak-ink:#942e29;--ak-border:#e4aaa5;
    }
    [data-status="borrowed"]{
      --ak-bg:#fff0e3;--ak-ink:#8c4915;--ak-border:#e7ba91;
    }
    [data-status="returned"]{
      --ak-bg:#e5f1fb;--ak-ink:#245c89;--ak-border:#a1c4df;
    }
    [data-status="no-key"]{
      --ak-bg:#f0eafb;--ak-ink:#65468d;--ak-border:#c8b6e2;
    }
    [data-status="legacy"]{
      --ak-bg:#f1f1ef;--ak-ink:#62625a;--ak-border:#cdcdc4;
    }
    #mainStatus{
      background:var(--ak-bg);
      color:var(--ak-ink);
      border-color:var(--ak-border);
      font-weight:600;
    }
    .ak-vehicle-plate{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:78px;
      padding:3px 9px;
      border:1px solid #afc6d1;
      border-radius:7px;
      background:linear-gradient(180deg,#ffffff,#eef5f8);
      color:#17465b;
      font-size:13px;
      font-weight:600;
      line-height:1.15;
      white-space:nowrap;
      box-shadow:0 1px 2px rgba(23,70,91,.08);
    }
    .callout{
      background:#eaf5f6;
      border-left:4px solid var(--teal);
      padding:13px 16px;
      border-radius:7px;
      margin:15px 0;
      color:#365b62;
    }
    .error{color:#a32d2d;white-space:pre-wrap}
    .empty{text-align:center;padding:35px;color:var(--muted)}
    .toast{
      position:fixed;
      right:24px;
      bottom:24px;
      max-width:500px;
      padding:16px 22px;
      border-radius:10px;
      background:var(--navy);
      color:white;
      z-index:100;
      box-shadow:0 6px 25px #0002;
      white-space:pre-wrap;
    }
    .toast.error{background:#a13232;color:white}
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:#12383f88;
      z-index:90;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .modal{
      background:white;
      border-radius:15px;
      max-width:820px;
      width:100%;
      max-height:90vh;
      overflow:auto;
      padding:26px;
    }
    .modal h2{margin-bottom:15px}
    .modal .table-wrap{max-height:360px}
    .tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
    .tabs button{
      background:#e4eef0;
      border:0;
      border-radius:8px;
      padding:9px 15px;
      color:var(--navy);
    }
    .tabs button.active{background:var(--teal);color:white}
    .busy{
      position:fixed;
      top:0;
      height:4px;
      background:#00a8aa;
      width:100%;
      z-index:200;
      animation:pulse 1s infinite;
    }
    .pagination{
      margin-top:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }
    .checkbox-line{display:flex;gap:8px;align-items:center}
    .checkbox-line input{width:18px}
    .vehicle-row{margin-bottom:8px}
    @keyframes pulse{50%{opacity:.4}}
    @media(max-width:760px){
      .main{padding:8px 12px}
      .topbar{gap:6px;flex-wrap:wrap;align-items:flex-start}
      .top-actions{gap:5px;justify-content:flex-end}
      .row,.row.employee-row{grid-template-columns:1fr}
      .card{padding:18px}
      .login{margin:5vh 18px}
      .modal{padding:18px}
      .toast{right:12px;left:12px;bottom:12px}
      #content .table-wrap{max-height:calc(100vh - 240px)}
    }
    /* Compact rows and two-line test results */
#content th,
#content td {
  padding: 3px 8px;
}

#content td .attempt-result {
  padding: 2px 5px;
  line-height: 1.1;
}

#content td .attempt-result strong {
  display: block;
  font-size: 13px;
  line-height: 1.1;
}

#content td .attempt-result small {
  display: block;
  margin-top: 1px;
  font-size: 11px;
  line-height: 1.1;
}
  </style>
</head>
<body>
  <div id="busy" class="busy hidden" aria-label="กำลังดำเนินการ"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="login" class="login card">
    <div class="brand">STORE OPERATIONS</div>
    <h1>Alcohol Test<br>&amp; Key Control</h1>
    <p class="muted">ระบบตรวจแอลกอฮอล์และเบิก–คืนกุญแจ</p>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required maxlength="80">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password"
          autocomplete="current-password" required maxlength="128">
      </div>
      <p id="loginError" class="error" role="alert"></p>
      <button class="btn" style="width:100%">เข้าสู่ระบบ</button>
    </form>
    <p class="muted" style="font-size:12px;margin:20px 0 0">
      บัญชีผู้ใช้สร้างโดย Admin • ระบบอิสระ ไม่เชื่อมระบบจองรถ
      <br>Cloudflare Worker + D1 • หน่วยตรวจ mg/L
    </p>
  </div>
  <div id="shell" class="shell hidden">
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">ตรวจแอลกอฮอล์ / เบิก–คืนกุญแจ</h1>
          <div class="muted" id="pageSubtitle">
            New → ตรวจครั้งที่ 1 → ตรวจซ้ำถ้าจำเป็น → มอบ / รับคืนกุญแจ
          </div>
        </div>
        <div class="top-actions">
          <button id="adminSettingsBtn" class="btn secondary tiny hidden">
            ตั้งค่า
          </button>
          <button id="mainBackBtn" class="btn secondary tiny">ตารางหลัก</button>
          <div class="account" id="account"></div>
          <button id="refreshBtn" class="btn secondary tiny">รีเฟรช</button>
          <button id="changeBtn" class="btn secondary tiny">รหัสผ่าน</button>
          <button id="logoutBtn" class="btn secondary tiny">ออก</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>
  <div id="modal" class="modal-backdrop hidden"
    role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modalContent"></div>
  </div>
  <script>
    "use strict";
    const API_BASE = "https://alcohol-key-control-api.mrtafrc.workers.dev";
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? "").replace(
      /[&<>"']/g,
      ch => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[ch])
    );
    const state = {
      token:"",
      user:null,
      data:null,
      history:null,
      page:"main",
      admin:null,
      adminTab:"vehicles",
      busy:0,
      forcedPassword:false
    };
    const mainFilter = { search:"", status:"", page:1 };
    const testLabels = {
      Passed:"ผ่าน",
      Awaiting2:"รอตรวจครั้งที่ 2",
      Awaiting3:"รอตรวจครั้งที่ 3",
      Failed:"ไม่ผ่าน - จบการตรวจ",
      Legacy:"ข้อมูลเดิม - ไม่ระบุการตัดสิน"
    };
    const keyLabels = {
      Borrowed:"ยังไม่คืน",
      Returned:"คืนแล้ว",
      NoKey:"ไม่เบิกกุญแจ",
      NotIssued:"ยังไม่มอบ"
    };
    const statusStyles = {
      "":"all",
      Awaiting:"waiting",
      Awaiting2:"waiting",
      Awaiting3:"waiting",
      Passed:"passed",
      Failed:"failed",
      Borrowed:"borrowed",
      Returned:"returned",
      NoKey:"no-key",
      NotIssued:"waiting",
      Legacy:"legacy"
    };
    const requestId = () => "R_" + crypto.randomUUID();
    const dt = value => value
      ? new Date(value).toLocaleString("th-TH", {
          timeZone:"Asia/Bangkok",
          year:"numeric",
          month:"2-digit",
          day:"2-digit",
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        })
      : "—";
    const dateInputSeconds = () =>
      new Date(Date.now() + 7 * 3600000).toISOString().slice(0,19);
    function actualName(value) {
      return String(value || "").trim() || "ไม่ระบุในข้อมูลเดิม";
    }
    function inspectionOwnerName(record) {
  const firstAttempt = (record?.Attempts || []).find(
    attempt => Number(attempt.AttemptNo) === 1
  );

  return String(firstAttempt?.InspectorName || "").trim();
}
    function toast(message, error = false) {
      $("toast").textContent = message;
      $("toast").classList.toggle("error", error);
      $("toast").classList.remove("hidden");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(
        () => $("toast").classList.add("hidden"),
        6500
      );
    }
    function fail(error) {
      toast(error.message || String(error), true);
    }
    function setBusy(on) {
      state.busy = Math.max(0, state.busy + (on ? 1 : -1));
      $("busy").classList.toggle("hidden", !state.busy);
      document.querySelectorAll("button").forEach(button => {
        if (state.busy) {
          if (!button.disabled) {
            button.dataset.busyDisabled = "1";
            button.disabled = true;
          }
        } else if (button.dataset.busyDisabled) {
          button.disabled = false;
          delete button.dataset.busyDisabled;
        }
      });
    }
    async function call(action, data = {}) {
      setBusy(true);
      try {
        let response;
        try {
          response = await fetch(API_BASE + "/api", {
            method:"POST",
            cache:"no-store",
            headers:{
              "Content-Type":"application/json",
              ...(state.token
                ? { Authorization:"Bearer " + state.token }
                : {})
            },
            body:JSON.stringify({ ...data, action })
          });
        } catch {
          throw new Error(
            "เชื่อมต่อ Worker ไม่สำเร็จ ตรวจอินเทอร์เน็ต และรอ Deploy ให้เสร็จ"
          );
        }
        let result;
        try {
          result = await response.json();
        } catch {
          throw new Error(
            "Worker ไม่ได้ตอบกลับเป็น JSON ตรวจ API URL และ Worker Deploy"
          );
        }
        if (!response.ok || !result.ok) {
          const message = result.error || `API error ${response.status}`;
          if (message.startsWith("SESSION_EXPIRED")) resetLogin();
          throw new Error(message);
        }
        return result.data;
      } finally {
        setBusy(false);
      }
    }
    function closeModal(force = false) {
      if (state.forcedPassword && !force) return;
      $("modal").classList.add("hidden");
      $("modalContent").innerHTML = "";
      state.forcedPassword = false;
    }
    function openModal(html) {
      $("modalContent").innerHTML = html;
      $("modal").classList.remove("hidden");
      setTimeout(
        () => $("modalContent").querySelector("input,button")?.focus(),
        20
      );
    }
    function resetLogin() {
      state.token = "";
      state.user = null;
      state.data = null;
      state.history = null;
      state.admin = null;
      state.page = "main";
      state.forcedPassword = false;
      mainFilter.search = "";
      mainFilter.status = "";
      mainFilter.page = 1;
      sessionStorage.removeItem("atkc_token");
      closeModal(true);
      $("content").innerHTML = "";
      $("account").innerHTML = "";
      $("shell").classList.add("hidden");
      $("login").classList.remove("hidden");
      $("password").value = "";
    }
    function updateAccount() {
      $("account").innerHTML =
        `<strong>${esc(state.user.displayName)}</strong><br>` +
        `<span class="muted">${esc(state.user.role)} • ` +
        `${esc(state.user.username)}</span>`;
      $("adminSettingsBtn").classList.toggle(
        "hidden",
        state.user.role !== "Admin"
      );
    }
    function showShell() {
      $("login").classList.add("hidden");
      $("shell").classList.remove("hidden");
      updateAccount();
    }
    async function load() {
      state.page = "main";
      await renderMain();
      showShell();
    }
    async function renderPage() {
      if (state.page === "admin") {
        $("pageTitle").textContent = "ตั้งค่าระบบ";
        $("pageSubtitle").textContent = "รถ บัญชีผู้ใช้ และ Audit Log";
        state.admin = await call("adminData");
        renderAdmin();
      } else {
        $("pageTitle").textContent = "ตรวจแอลกอฮอล์ / เบิก–คืนกุญแจ";
        $("pageSubtitle").textContent =
          "New → ตรวจครั้งที่ 1 → ตรวจซ้ำถ้าจำเป็น → มอบ / รับคืนกุญแจ";
        await renderMain();
      }
    }
    function badge(label, status) {
      return `<span class="badge" data-status="${
        esc(statusStyles[status] || "all")
      }">${esc(label)}</span>`;
    }
    function testBadge(status) {
      return badge(testLabels[status] || status, status);
    }
    function plateLabel(plate) {
      return plate
        ? `<span class="ak-vehicle-plate">${esc(plate)}</span>`
        : "—";
    }
    function table(headers, rows) {
      if (!rows.length) return '<div class="empty">ไม่มีรายการ</div>';
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>${row.map(cell => `<td>${cell}</td>`).join("")}</tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }
    function attemptCell(record, number) {
  const attempt = (record.Attempts || []).find(
    a => Number(a.AttemptNo) === number
  );

  if (!attempt) {
    return `<span class="muted">${
      record.TestStatus === "Awaiting" + number
        ? "ยังไม่ได้ตรวจ"
        : "N/A"
    }</span>`;
  }

  const passed = attempt.Decision === "Passed";
  const failed = attempt.Decision === "NotPassed";
  const label = passed ? "ผ่าน" : failed ? "ไม่ผ่าน" : "ไม่ระบุ";

  return `
    <div class="attempt-result ${
      passed ? "attempt-pass" : failed ? "attempt-fail" : ""
    }">
      <strong>${esc(attempt.Result)} mg/L · ${label}</strong>
      <small>${dt(attempt.TestedAt)}</small>
    </div>
  `;
}
    function canHandoverRecord(record) {
      if (
        !record ||
        record.TestStatus !== "Passed" ||
        record.KeyStatus !== "NotIssued"
      ) {
        return false;
      }
      let planned;
      try {
        planned = JSON.parse(record.PlannedVehicleIDs || "[]");
      } catch {
        return false;
      }
      if (!Array.isArray(planned) || !planned.length) return false;
      const latest = (record.Attempts || []).find(
        attempt => Number(attempt.AttemptNo) === Number(record.AttemptCount)
      );
      return Boolean(
        latest &&
        latest.Decision === "Passed" &&
        latest.Result !== null &&
        latest.Result !== undefined &&
        String(latest.Result).trim() !== "" &&
        Number(latest.Result) === 0
      );
    }
    async function renderMain() {
      const view = await call("mainView", { ...mainFilter });
      state.data = view.bootstrap;
      state.user = view.bootstrap.user;
      state.history = view.history;
      mainFilter.page = view.history.page;
      updateAccount();
      const history = state.history;
      const rows = history.rows.map(record => {

    function parseEmployeeQR(raw) {
      if (typeof raw !== "string" || raw.length > 1000) {
        throw new Error("ข้อมูล QR ไม่ถูกต้อง");
      }
      const parts = raw.trim().split(",").map(part => part.trim());
      if (
        parts.length !== 4 ||
        parts.some(part => !part) ||
        !/^[A-Za-z0-9_.-]{1,80}$/.test(parts[0]) ||
        parts[1].length > 200 ||
        parts[2].length > 200
      ) {
        throw new Error("QR ต้องมี GID,ชื่อ,แผนก,ตำแหน่ง จำนวน 4 ช่อง");
      }
      return {
        gid:parts[0],
        name:parts[1],
        department:parts[2]
      };
    }
    function qrFields(prefix) {

            • ข้อมูลด้านล่างคือข้อมูลที่จะบันทึก
          </small>
          <div id="${prefix}QRError" class="error"></div>
        </div>
        <div class="row employee-row">
          <div class="field">
            <label for="${prefix}GID">GID *</label>
            <input id="${prefix}GID" maxlength="80"
              autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="${prefix}Name">ชื่อ *</label>
            <input id="${prefix}Name" maxlength="200" autocomplete="off">
          </div>
          <div class="field">
            <label for="${prefix}Department">แผนก *</label>
            <input id="${prefix}Department" maxlength="200" autocomplete="off">
          </div>
        </div>
      `;
    }
    function bindQR(prefix, formId) {
      const input = $(prefix + "QR");
      const error = $(prefix + "QRError");
      const fields = ["GID","Name","Department"].map(
        key => $(prefix + key)
      );
      let timer;
      let lastParsed = "";
      function nextActionField() {
        return $(formId).querySelector(
          "#attemptResult,#receiverName,textarea"
        );
      }
      function parse(showError = false) {
        clearTimeout(timer);
        if (input.value === lastParsed) return Boolean(fields[0].value);
        lastParsed = input.value;
        error.textContent = "";
        if (!input.value.trim()) return false;
        try {
          const person = parseEmployeeQR(input.value);
          fields[0].value = person.gid;
          fields[1].value = person.name;
          fields[2].value = person.department;
          return true;
        } catch (err) {
          fields.forEach(field => field.value = "");
          if (showError) error.textContent = err.message;
          return false;
        }
      }
      input.oninput = () => {
        clearTimeout(timer);
        if (input.value.trim()) {
          fields.forEach(field => field.value = "");
        }
        error.textContent = "";
        timer = setTimeout(() => parse(true),120);
      };
      input.onblur = () => parse(true);
      input.onkeydown = event => {
        if (
          ["Enter","Tab"].includes(event.key) &&
          input.value.trim()
        ) {
          event.preventDefault();
          if (parse(true)) nextActionField()?.focus();
        } else if (event.key === "Enter") {
          event.preventDefault();
          fields[0].focus();
        }
      };
      fields.forEach((field,index) => {
        field.oninput = () => {
          clearTimeout(timer);
          lastParsed = input.value;
          error.textContent = "";
        };
        field.onkeydown = event => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          (fields[index + 1] || nextActionField())?.focus();
        };
      });
      setTimeout(() => input.focus(),30);
      return () => {
        clearTimeout(timer);
        if (input.value !== lastParsed) parse(true);
        const person = {
          gid:fields[0].value.trim(),
          name:fields[1].value.trim(),
          department:fields[2].value.trim()
        };
        if (
          !/^[A-Za-z0-9_.-]{1,80}$/.test(person.gid) ||
          !person.name ||
          !person.department ||
          person.name.length > 200 ||
          person.department.length > 200
        ) {
          throw new Error("กรุณากรอก GID ชื่อ และแผนกให้ครบถ้วน");
        }
        return person;
      };
    }

            </button>
          </div>
        </form>
      `);
      const getEmployee = bindQR("return","returnForm");
      $("cancelReturn").onclick = () => closeModal();
      let submitted = false;
      $("returnForm").onsubmit = async event => {
        event.preventDefault();
        if (submitted) return;
        try {
          const returnedBy = getEmployee();
          const receiverName = $("receiverName").value.trim();
          if (!receiverName) {
            throw new Error("กรุณากรอกชื่อผู้รับคืน");
          }
          submitted = true;
          const output = await call("returnKey", {
            requestId:rid,
            detailId:id,
            returnedBy,
            receiverName,
            notes:$("returnNotes").value
          });
          closeModal();
          toast(output.message);
          await renderMain();
        } catch (error) {
          submitted = false;
          fail(error);
        }
      };
    }
    async function handoverModal(record) {
      if (!canHandoverRecord(record)) {
        return toast(
          "รายการนี้ไม่มีรถรอมอบกุญแจ หรือผลตรวจไม่เข้าเงื่อนไข",
          true
        );
      }
      let planned;
      try {
        planned = JSON.parse(record.PlannedVehicleIDs || "[]");
        if (!Array.isArray(planned) || !planned.length) {
          throw new Error("รายการนี้ไม่มีรถรอมอบกุญแจ");
        }
      } catch (error) {
        return fail(error);
      }
      const issued = state.history.rows
        .filter(row => row.RecordID === record.RecordID && row.VehicleID)
        .map(row => row.VehicleID);
      if (issued.length) {
        return toast(
          "รายการตรวจนี้เคยมอบกุญแจแล้ว หากเบิกใหม่ให้สร้างรายการตรวจใหม่",
          true
        );
      }
      try {
        state.data = await call("bootstrap");
      } catch (error) {
        return fail(error);
      }
      const rid = requestId();
      openModal(`
        <h2 id="modalTitle">มอบกุญแจรถ</h2>
        <p>
          <strong>${esc(record.EmployeeName)}</strong>
          / ${esc(record.Department)}
        </p>
        <form id="handoverForm">
          <div class="field">
            <label>ทะเบียนรถ *</label>
            <div id="vehicleSelects"></div>
            <small>มอบได้เพียง 1 คันต่อรายการตรวจ</small>
          </div>
          <div class="field">
            <label for="handoverNotes">หมายเหตุ</label>
            <textarea id="handoverNotes" maxlength="2000"></textarea>
          </div>
          <div class="callout">
            ผู้ตรวจ/ผู้มอบกุญแจ:
${esc(actualName(inspectionOwnerName(record)))}
            <br>เวลามอบบันทึกอัตโนมัติ
            • รถที่ยังไม่คืนมอบซ้ำไม่ได้
          </div>
          <div class="toolbar">
            <button class="btn" type="submit">ยืนยันมอบกุญแจ</button>
            <button id="cancelHandover" class="btn secondary" type="button">
              ยกเลิก
            </button>
          </div>
        </form>
      `);
      // Limit options to the planned vehicles.
      // For legacy multi-car plans, choose one explicitly;
      // the old planned data is not rewritten.
      const getIds = bindVehicleSelects(
        planned.length === 1 ? planned : [],
        issued,
        planned
      );
      $("cancelHandover").onclick = () => closeModal();
      let submitted = false;
      $("handoverForm").onsubmit = async event => {
        event.preventDefault();
        if (submitted) return;
        try {
          const ids = getIds();
          if (!ids.length) throw new Error("กรุณาเลือกรถ");
          if (ids.some(id => !planned.includes(id))) {
            throw new Error("กรุณาเลือกเฉพาะรถที่อยู่ในรายการเบิกนี้");
          }
          submitted = true;
          const output = await call("handoverKey", {
            requestId:rid,
            recordId:record.RecordID,
            vehicleIds:ids,
            notes:$("handoverNotes").value
          });
          closeModal();
          toast(output.message);
          await renderMain();
        } catch (error) {
          submitted = false;
          fail(error);
        }
      };
    }
    function inspectionDetails(record) {
      if (!record) return;
      openModal(`
        <h2 id="modalTitle">ประวัติการตรวจ</h2>
        <p>
          ${esc(record.EmployeeName)} / ${esc(record.Department)}<br>
          <small>${esc(record.EmployeeID)} • ${esc(record.RecordID)}</small>
        </p>
        ${testBadge(record.TestStatus)}
        <div style="margin-top:15px">
          ${table([
            "ครั้งที่",
            "ผล mg/L",
            "วันเวลาตรวจ",
            "การตัดสิน",
            "ผู้ตรวจ",
            "ผู้บันทึก",
            "เวลาบันทึก",
            "หมายเหตุ"
          ], (record.Attempts || []).map(attempt => [
            esc(attempt.AttemptNo),
            esc(attempt.Result),
            dt(attempt.TestedAt),

              attempt.Decision === "Passed"
                ? "ผ่าน"

                  ? "ไม่ผ่าน"

            ),
            esc(actualName(attempt.InspectorName)),
            esc(attempt.RecordedByName || attempt.RecordedBy || "—"),
            dt(attempt.RecordedAt),
            `<div class="notes-cell">${esc(attempt.Notes || "—")}</div>`
          ]))}
        </div>
        <p style="margin-top:15px">
          หมายเหตุครั้งแรก: ${esc(record.Notes || "—")}
        </p>
        <div class="callout">
          ทะเบียนรถ: ${esc(record.Plate || "—")}<br>
          มอบกุญแจ: ${dt(record.BorrowedAt)}<br>
          มอบโดย: ${esc(record.HandoverByName || "—")}<br>
          รับคืน: ${dt(record.ReturnedAt)}<br>
          รับคืนโดย: ${esc(
            record.ReturnedAt ? actualName(record.ReceivedByName) : "—"
          )}<br>
          ผู้บันทึกรับคืน: ${esc(record.ReceivedRecordedByName || "—")}<br>
          พนักงานผู้คืน: ${esc(record.ReturnedByName || "—")}
          ${record.ReturnedByGID ? " / " + esc(record.ReturnedByGID) : ""}
          ${record.ReturnedByDepartment
            ? " / " + esc(record.ReturnedByDepartment)
            : ""}<br>
          หมายเหตุรับคืน: ${esc(record.ReturnNotes || "—")}
        </div>
        <p class="muted">
          ข้อมูลเดิมแสดงตามที่มี
          ไม่เติมชื่อเจ้าหน้าที่หรือเปลี่ยนผลตรวจย้อนหลังอัตโนมัติ
        </p>
        <button id="closeDetails" class="btn secondary">ปิด</button>
      `);
      $("closeDetails").onclick = () => closeModal();
    }
    function renderAdmin() {
      const admin = state.admin;
      $("content").innerHTML = `
        <div class="tabs">
          ${[
            ["vehicles","รถ"],
            ["users","ผู้ใช้ / สิทธิ์"],
            ["audit","Audit Log"]
          ].map(([id,label]) => `
            <button data-tab="${id}"
              class="${state.adminTab === id ? "active" : ""}">
              ${label}
            </button>
          `).join("")}
        </div>
        <div class="card" id="adminPanel"></div>
      `;
      $("content").querySelectorAll("[data-tab]").forEach(button => {
        button.onclick = () => {
          state.adminTab = button.dataset.tab;
          renderAdmin();
        };
      });
      const panel = $("adminPanel");
      if (state.adminTab === "vehicles") {
        panel.innerHTML = `
          <div class="toolbar" style="margin-bottom:15px">
            <h2 style="margin:0">ทะเบียนรถ</h2>
            <button class="btn fixed" id="addAdminVehicle">เพิ่มรถ</button>
          </div>
          ${table([
            "Vehicle ID",
            "แผนกเจ้าของรถ",
            "ทะเบียนรถ",
            "ชื่อรถ",
            "ใช้งาน",
            "กุญแจ",
            "จัดการ"
          ], admin.vehicles.map(vehicle => [
            esc(vehicle.VehicleID),
            esc(vehicle.OwnerDepartment || "—"),
            plateLabel(vehicle.Plate),
            esc(vehicle.VehicleName),
            vehicle.Active ? "ใช่" : "ไม่",
            badge(
              vehicle.Borrowed ? "ยังไม่คืน" : "พร้อมเบิก",
              vehicle.Borrowed ? "Borrowed" : "Passed"
            ),
            `<button class="btn secondary tiny"
              data-vehicle="${esc(vehicle.VehicleID)}">แก้ไข</button>`
          ]))}
        `;
        $("addAdminVehicle").onclick = () => vehicleModal();
        panel.querySelectorAll("[data-vehicle]").forEach(button => {
          button.onclick = () => vehicleModal(
            admin.vehicles.find(
              vehicle => vehicle.VehicleID === button.dataset.vehicle
            )
          );
        });
      } else if (state.adminTab === "users") {
        panel.innerHTML = `
          <div class="toolbar" style="margin-bottom:15px">
            <h2 style="margin:0">บัญชีผู้ใช้และสิทธิ์</h2>
            <button class="btn fixed" id="addUser">เพิ่มผู้ใช้</button>
          </div>
          <p class="muted">
            ทุกบัญชีบันทึกผลและรับคืนกุญแจได้ทุกแผนก
            • เฉพาะ Admin จัดการตั้งค่า
          </p>
          ${table([
            "Username","ชื่อ","Role","ใช้งาน","จัดการ"
          ], admin.users.map(user => [
            esc(user.Username),
            esc(user.DisplayName),
            badge(user.Role,""),
            user.Active ? "ใช่" : "ไม่",
            `<button class="btn secondary tiny"
              data-user="${esc(user.Username)}">แก้ไข</button>`
          ]))}
        `;
        $("addUser").onclick = () => userModal();
        panel.querySelectorAll("[data-user]").forEach(button => {
          button.onclick = () => userModal(
            admin.users.find(user => user.Username === button.dataset.user)
          );
        });
      } else {
        panel.innerHTML = `
          <h2>Audit Log</h2>
          <p class="muted">
            แสดง 100 รายการล่าสุด • เก็บใน D1
            • ไม่บันทึกรหัสผ่านลง Audit Log
          </p>
          ${table([
            "วันเวลา",
            "ผู้ดำเนินการ",
            "Action",
            "ประเภท",
            "Entity ID",
            "รายละเอียด"
          ], admin.audit.map(row => [
            dt(row.Timestamp),
            esc(row.Actor),
            esc(row.Action),
            esc(row.EntityType),
            esc(row.EntityID),
            `<div style="max-width:450px;white-space:normal;
              overflow-wrap:anywhere">${esc(row.DetailsJSON)}</div>`
          ]))}
        `;
      }
    }
    async function refreshAdmin() {
      state.admin = await call("adminData");
      renderAdmin();
    }
    function vehicleModal(vehicle = {}) {
      const rid = requestId();
      openModal(`
        <h2 id="modalTitle">${vehicle.VehicleID ? "แก้ไข" : "เพิ่ม"}รถ</h2>
        <form id="vehicleForm">
          <div class="field">
            <label for="vehicleId">Vehicle ID *</label>
            <input id="vehicleId" value="${esc(vehicle.VehicleID)}"
              ${vehicle.VehicleID ? "readonly" : ""}
              required maxlength="80" placeholder="เช่น CAR001">
          </div>
          <div class="field">
            <label for="vehiclePlate">ทะเบียนรถ *</label>
            <input id="vehiclePlate" value="${esc(vehicle.Plate)}"
              required maxlength="100">
          </div>
          <div class="field">
            <label for="vehicleOwnerDepartment">แผนกเจ้าของรถ</label>
            <input id="vehicleOwnerDepartment"
              value="${esc(vehicle.OwnerDepartment || "")}"
              maxlength="80"
              placeholder="เช่น COM, SIG, TRW/TRD">
          </div>
          <div class="field">
            <label for="vehicleName">ชื่อรถ *</label>
            <input id="vehicleName" value="${esc(vehicle.VehicleName)}"
              required maxlength="200">
          </div>
          <label class="checkbox-line field">
            <input id="vehicleActive" type="checkbox"
              ${vehicle.Active !== false ? "checked" : ""}>
            เปิดใช้งาน
          </label>
          <div class="toolbar">
            <button class="btn" type="submit">บันทึก</button>
            <button id="cancelVehicle" type="button"
              class="btn secondary">ยกเลิก</button>
          </div>
        </form>
      `);
      $("cancelVehicle").onclick = () => closeModal();
      let submitted = false;
      $("vehicleForm").onsubmit = async event => {
        event.preventDefault();
        if (submitted) return;
        try {
          submitted = true;
          const output = await call("saveVehicle", {
            requestId:rid,
            vehicleId:$("vehicleId").value,
            plate:$("vehiclePlate").value,
            vehicleName:$("vehicleName").value,
            ownerDepartment:$("vehicleOwnerDepartment").value.trim(),
            active:$("vehicleActive").checked
          });
          closeModal();
          toast(output.message);
          await refreshAdmin();
        } catch (error) {
          submitted = false;
          fail(error);
        }
      };
    }
    function userModal(user = {}) {
      const rid = requestId();
      openModal(`
        <h2 id="modalTitle">${user.Username ? "แก้ไข" : "เพิ่ม"}ผู้ใช้</h2>
        <form id="userForm">
          <div class="row">
            <div class="field">
              <label for="userName">Username *</label>
              <input id="userName" value="${esc(user.Username)}"
                ${user.Username ? "readonly" : ""}
                required maxlength="80">
            </div>
            <div class="field">
              <label for="userDisplay">ชื่อแสดงผล *</label>
              <input id="userDisplay" value="${esc(user.DisplayName)}"
                required maxlength="200">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="userRole">Role *</label>
              <select id="userRole">
                <option value="Operator">Operator</option>
                <option value="Admin">Admin</option>
              </select>
            </div>
            <div class="field">
              <label for="userPassword">
                ${user.Username
                  ? "รหัสผ่านใหม่ — เว้นว่างถ้าไม่เปลี่ยน"
                  : "รหัสผ่านเริ่มต้น *"}
              </label>
              <input id="userPassword" type="password"
                autocomplete="new-password" minlength="8" maxlength="128"
                ${user.Username ? "" : "required"}>
            </div>
          </div>
          <label class="checkbox-line field">
            <input id="userActive" type="checkbox"
              ${user.Active !== false ? "checked" : ""}>
            เปิดใช้งาน
          </label>
          <div class="callout">
            รหัสผ่าน 8–128 ตัวอักษร
            • บัญชีใหม่หรือ Reset ต้องเปลี่ยนรหัสผ่านเมื่อ Login
            • การแก้บัญชีจะยกเลิก Session เดิมของบัญชีนั้น
          </div>
          <div class="toolbar">
            <button class="btn" type="submit">บันทึก</button>
            <button id="cancelUser" type="button" class="btn secondary">
              ยกเลิก
            </button>
          </div>
        </form>
      `);
      $("userRole").value = user.Role || "Operator";
      $("cancelUser").onclick = () => closeModal();
      let submitted = false;
      $("userForm").onsubmit = async event => {
        event.preventDefault();
        if (submitted) return;
        try {
          submitted = true;
          const output = await call("saveUser", {
            requestId:rid,
            username:$("userName").value,
            displayName:$("userDisplay").value,
            role:$("userRole").value,
            password:$("userPassword").value,
            active:$("userActive").checked
          });
          closeModal();
          toast(output.message);
          await refreshAdmin();
        } catch (error) {
          submitted = false;
          fail(error);
        }
      };
    }
    function passwordModal(forced = false) {
      state.forcedPassword = forced;
      const rid = requestId();
      openModal(`
        <h2 id="modalTitle">${
          forced ? "เปลี่ยนรหัสผ่านก่อนใช้งาน" : "เปลี่ยนรหัสผ่าน"
        }</h2>
        <form id="passwordForm">
          <div class="field">
            <label for="oldPassword">รหัสผ่านเดิม</label>
            <input id="oldPassword" type="password"
              autocomplete="current-password" required maxlength="128">
          </div>
          <div class="field">
            <label for="newPassword">รหัสผ่านใหม่ 8–128 ตัวอักษร</label>
            <input id="newPassword" type="password"
              autocomplete="new-password"
              minlength="8" maxlength="128" required>
          </div>
          <div class="field">
            <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
            <input id="confirmPassword" type="password"
              autocomplete="new-password"
              minlength="8" maxlength="128" required>
          </div>
          <div class="toolbar">
            <button class="btn" type="submit">เปลี่ยนรหัสผ่าน</button>
            <button id="cancelPassword" type="button" class="btn secondary">
              ${forced ? "ออกจากระบบ" : "ยกเลิก"}
            </button>
          </div>
        </form>
      `);
      $("cancelPassword").onclick = async () => {
        if (!forced) {
          closeModal();
          return;
        }
        try {
          await call("logout");
        } catch {
          // Always allow local logout if the network is unavailable.
        }
        resetLogin();
      };
      let submitted = false;
      $("passwordForm").onsubmit = async event => {
        event.preventDefault();
        if (submitted) return;
        if ($("newPassword").value !== $("confirmPassword").value) {
          return toast("รหัสผ่านใหม่ไม่ตรงกัน",true);
        }
        try {
          submitted = true;
          const output = await call("changePassword", {
            requestId:rid,
            currentPassword:$("oldPassword").value,
            newPassword:$("newPassword").value
          });
          resetLogin();
          toast(output.message);
        } catch (error) {
          submitted = false;
          fail(error);
        }
      };
    }
    $("loginForm").onsubmit = async event => {
      event.preventDefault();
      $("loginError").textContent = "";
      try {
        const output = await call("login", {
          username:$("username").value,
          password:$("password").value
        });
        state.token = output.token;
        state.user = output.user;
        sessionStorage.setItem("atkc_token",state.token);
        $("password").value = "";
        if (state.user.mustChangePassword) {
          passwordModal(true);
        } else {
          await load();
        }
      } catch (error) {
        $("loginError").textContent = error.message;
      }
    };
    $("logoutBtn").onclick = async () => {
      try {
        await call("logout");
      } catch {
        // Always clear local credentials.
      }
      resetLogin();
    };
    $("changeBtn").onclick = () => passwordModal();
    $("refreshBtn").onclick = async () => {
      try {
        await renderPage();
        toast("ข้อมูลล่าสุดแล้ว");
      } catch (error) {
        fail(error);
      }
    };
    $("mainBackBtn").onclick = async () => {
      state.page = "main";
      await renderPage().catch(fail);
    };
    $("adminSettingsBtn").onclick = async () => {
      state.page = "admin";
      await renderPage().catch(fail);
    };
    document.addEventListener("keydown",event => {
      if (
        event.key === "Escape" &&
        !state.busy &&
        !state.forcedPassword
      ) {
        closeModal();
      }
    });
    $("modal").addEventListener("click",event => {
      if (
        event.target === $("modal") &&
        !state.busy &&
        !state.forcedPassword
      ) {
        closeModal();
      }
    });
    window.addEventListener("DOMContentLoaded",async () => {
      const token = sessionStorage.getItem("atkc_token");
      if (!token) return;
      state.token = token;
      try {
        await load();
      } catch (error) {
        if (error.message.startsWith("CHANGE_PASSWORD")) {
          passwordModal(true);
        } else {
          resetLogin();
          fail(error);
        }
      }
    });
  </script>
</body>
</html>
